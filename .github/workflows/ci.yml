name: CI

on:
  push:
    branches: [main, 'phase/**']
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm
      - name: Install dependencies
        id: install
        shell: bash
        run: |
          set +e
          pnpm install --no-frozen-lockfile --reporter=append-only > install.log 2>&1
          status=$?
          cat install.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload install diagnostics
        if: steps.install.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-install-log
          path: install.log
      - name: Upload resolved lockfile
        if: steps.install.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: resolved-pnpm-lock
          path: pnpm-lock.yaml
      - name: Fail on install error
        if: steps.install.outputs.status != '0'
        run: exit 1
      - name: Run quality checks
        id: quality
        shell: bash
        run: |
          set +e
          mkdir -p quality-logs
          status=0

          run_check() {
            name="$1"
            shift
            echo "::group::$name"
            "$@" > "quality-logs/$name.log" 2>&1
            code=$?
            cat "quality-logs/$name.log"
            echo "::endgroup::"
            if [ "$code" -ne 0 ]; then
              status=1
            fi
          }

          run_check lint pnpm lint
          run_check typecheck pnpm typecheck
          run_check test pnpm test
          run_check build pnpm build

          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload quality diagnostics
        if: steps.quality.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: quality-check-logs
          path: quality-logs/
      - name: Fail on quality error
        if: steps.quality.outputs.status != '0'
        run: exit 1

  browser-smoke:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile --reporter=append-only
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
